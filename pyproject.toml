[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor"
version = "0.1.0"
description = "AI-assisted coding practice: generated exercises, deterministic validation"
readme = "README.md"
# mrjob is unmaintained and breaks on 3.13 (no `pipes` module); see docs/design.md.
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
bigdata = [
    "pyspark>=3.5,<3.6",
    "mrjob==0.7.4",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pre-commit>=3",
]

# Loaded by every pytest run in this venv; it records only workspace exercise runs. The
# name equals the module name, so an explicit `-p tutor.attempts` is not a second copy.
[project.entry-points.pytest11]
"tutor.attempts" = "tutor.attempts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: slow runs that start a JVM (Spark or Hadoop); run with `pytest -m spark`"]
# Plain `pytest` stays fast; a later `-m spark` on the command line overrides this.
addopts = "-m 'not spark'"
# mrjob 0.7.4 imports the stdlib `pipes` module (the reason it stops at Python 3.12).
filterwarnings = ["ignore:'pipes' is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Skeletons import what the student will need before any code uses it.
"examples/*/exercise/student.py" = ["F401"]
"examples/*/solution/skeleton.py" = ["F401"]

[tool.ruff.lint.isort]
# Exercise tests import sibling modules: the code under test as `student`, and the
# plain-Python specification as `oracle` (differential tests).
known-local-folder = ["student", "oracle"]

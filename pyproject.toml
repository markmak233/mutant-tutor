[build-system]
# 77+ reads the SPDX `license` string below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor"
version = "0.1.0"
description = "AI-assisted coding practice: generated exercises, deterministic validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Tested in CI on 3.11 to 3.14 (docs/design.md, "CI"). No upper bound: a cap makes pip and uv
# look for an older release instead of saying what fails; untested versions are named in CI.
requires-python = ">=3.11"
# pydantic: the batch format (schema.py), checked by validation rule 0. pypdfium2 + pillow:
# reading course PDFs into the materials cache (docs/design.md, "Reading files").
dependencies = ["pydantic>=2,<3", "pypdfium2>=5,<6", "pillow>=10"]

[project.optional-dependencies]
bigdata = [
    "pyspark>=3.5,<3.6",
    "mrjob==0.7.4",
    # mrjob is unmaintained and imports modules newer Pythons removed: `distutils` (3.12),
    # which setuptools' shim provides, and `pipes` (3.13), which standard-pipes, the
    # removed module as it was, brings back (docs/design.md, "Environment").
    "setuptools",
    "standard-pipes; python_version >= '3.13'",
]
# The phase 3 generation pipeline (python -m tutor.graph) and phase 4's agent route; only
# tutor/graph/build.py, its CLI and tutor/retrieval/agent.py import it. It pulls in
# langchain-core, which the project does not use. The
# SQLite checkpointer keeps a planned batch waiting for the owner's approval.
gen = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]
# The local GUI (python -m tutor.gui; docs/design.md, "Local GUI"): Flask brings Werkzeug,
# Jinja2, MarkupSafe, itsdangerous, click and blinker; with waitress, markdown-it-py (and its
# mdurl), its dollar-math plugin and latex2mathml for the questions' formulas, 12 packages.
gui = [
    "flask>=3.1,<4",
    "waitress>=3,<4",
    "markdown-it-py>=4,<5",
    "mdit-py-plugins>=0.5,<1",
    "latex2mathml>=3.77,<4",
    # Writes a course's workspace.toml from the settings page, keeping the owner's comments.
    "tomlkit>=0.13,<1",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pre-commit>=3",
]

# Loaded by every pytest run in this venv; it records only workspace exercise runs. The
# name equals the module name, so an explicit `-p tutor.attempts` is not a second copy.
[project.entry-points.pytest11]
"tutor.attempts" = "tutor.attempts"

[tool.setuptools.packages.find]
where = ["src"]

# The GUI's pages and stylesheet are not Python files, so a built package must be told to
# include them.
[tool.setuptools.package-data]
"tutor.gui" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: slow runs that start a JVM (Spark or Hadoop); run with `pytest -m spark`",
    "docker: real containers, needs Docker running; run with `pytest -m docker`",
]
# Plain `pytest` stays fast and needs no Docker; a later `-m ...` on the command line overrides this.
addopts = "-m 'not spark and not docker'"
# mrjob 0.7.4 imports the stdlib `pipes` module (the reason it stops at Python 3.12).
filterwarnings = ["ignore:'pipes' is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Skeletons import what the student will need before any code uses it.
"examples/*/exercise/student.py" = ["F401"]
"examples/*/solution/skeleton.py" = ["F401"]

[tool.ruff.lint.isort]
# Exercise tests import sibling modules: the code under test as `student`, and the
# plain-Python specification as `oracle` (differential tests).
known-local-folder = ["student", "oracle"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor"
version = "0.1.0"
description = "AI-assisted coding practice: generated exercises, deterministic validation"
readme = "README.md"
# mrjob is unmaintained and breaks on 3.13 (no `pipes` module); see docs/design.md.
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
comp9313 = [
    "pyspark>=3.5,<3.6",
    "mrjob==0.7.4",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pre-commit>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: slow end-to-end runs that start Spark; run with `pytest -m spark`"]
# Plain `pytest` stays fast; a later `-m spark` on the command line overrides this.
addopts = "-m 'not spark'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Skeletons import what the student will need before any code uses it.
"examples/*/exercise/student.py" = ["F401"]
"examples/*/solution/skeleton.py" = ["F401"]

[tool.ruff.lint.isort]
# Exercise tests import the code under test as a sibling module named `student`.
known-local-folder = ["student"]

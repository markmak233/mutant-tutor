[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor"
version = "0.1.0"
description = "AI-assisted coding practice: generated exercises, deterministic validation"
readme = "README.md"
# mrjob is unmaintained and breaks on 3.13 (no `pipes` module); see docs/design.md.
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
comp9313 = [
    "pyspark>=3.5,<3.6",
    "mrjob==0.7.4",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

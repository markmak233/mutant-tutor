# See docs/design.md, "CI". Runs when work reaches main (a push after a merge, or a pull
# request into main), and by hand from the Actions tab, which also runs the `spark` job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two versions the README promises; mrjob breaks on 3.13.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[bigdata,dev]"
      - run: ruff check .
      # No JDK on purpose: the fast suite starts no JVM (the `spark` marker is deselected).
      - run: pytest

  # End-to-end validation of the examples (about 3 min plus setup). Manual runs only; the
  # Hadoop tests skip here (no HADOOP_HOME), so run those locally.
  spark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[bigdata,dev]"
      - run: pytest -m spark -rs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      # Same gitleaks version and .gitleaks.toml as the local pre-commit hook.
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git --redact --no-banner --verbose

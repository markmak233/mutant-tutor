# See docs/design.md, "CI". Runs when work reaches main (a push after a merge, or a pull
# request into main), and by hand from the Actions tab, which also runs the `spark` job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is left out for now: mrjob 0.7.4 imports distutils, which 3.12 removed
        # (see docs/design.md, "CI"). mrjob breaks on 3.13.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # gui: tests/test_gui.py skips without Flask, and CI should run it.
      - run: pip install -e ".[bigdata,dev,gui]"
      - run: ruff check .
      # No JDK on purpose: the fast suite starts no JVM (the `spark` marker is deselected).
      - run: pytest

  # The same fast suite on macOS and Windows. A job of its own, so the `test (3.11)` check
  # that main's ruleset requires keeps its name. No Docker here: the macOS runner has none,
  # and the Windows runner runs only Windows containers (see docs/design.md, "CI").
  other-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[bigdata,dev,gui]"
      - run: ruff check .
      - run: pytest

  # Exercise code in real containers: the isolation itself, the examples (C included)
  # validated in the course's image, and a generated C item end to end. The tests skip
  # when Docker cannot run, which would pass quietly here, so a skip fails the job.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # gen: the end-to-end C test runs the item graph (it skips without langgraph). gui: the
      # GUI's test files skip at import without Flask, and the check below counts every skip.
      - run: pip install -e ".[bigdata,dev,gen,gui]"
      # Kernels from 6.5 randomise addresses with up to 32 bits, and gcc 12's AddressSanitizer
      # then sometimes never finishes (it loops on "DEADLYSIGNAL"); a container shares the
      # host's kernel. The C runs timed out here at 5 s while they pass in Docker Desktop's VM
      # (18 bits). The value is printed first, to compare (see docs/design.md, "CI").
      - name: Limit address randomisation to 28 bits for AddressSanitizer
        run: |
          echo "vm.mmap_rnd_bits was $(cat /proc/sys/vm/mmap_rnd_bits)"
          sudo sysctl -w vm.mmap_rnd_bits=28
      - run: pytest -m docker -rs --junitxml=docker-report.xml
      - name: Fail if any Docker test was skipped
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("docker-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"{tests} Docker tests, {skipped} skipped")
          sys.exit(1 if skipped or not tests else 0)
          EOF

  # End-to-end validation of the examples (about 3 min plus setup). Manual runs only; the
  # Hadoop tests skip here (no HADOOP_HOME), so run those locally.
  spark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[bigdata,dev]"
      - run: pytest -m spark -rs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      # Same gitleaks version and .gitleaks.toml as the local pre-commit hook.
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git --redact --no-banner --verbose

<!doctype html>
{# Every page extends this. Values are escaped by Jinja2; nothing here marks text as safe. #}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Courses{% endblock %} · mutant-tutor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('home') }}">mutant-tutor</a>
    <nav aria-label="Breadcrumb">{% block crumbs %}{% endblock %}</nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

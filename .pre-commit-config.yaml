# Install once per clone: .venv/bin/pre-commit install (Windows: .venv\Scripts\pre-commit install)
# Uses the system gitleaks instead of building it from source: brew install gitleaks
# (Windows: winget install Gitleaks.Gitleaks, then open a new shell so it is on PATH).
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets and home-directory paths in staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false

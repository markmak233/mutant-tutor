# Install once per clone: .venv/bin/pre-commit install
# Uses the system gitleaks (brew install gitleaks) instead of building it from source.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets and home-directory paths in staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false
